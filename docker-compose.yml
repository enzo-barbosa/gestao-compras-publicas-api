services:
  db:
    image: postgres:15-alpine
    container_name: gestao_compras_db
    environment:
      POSTGRES_DB: gestao_compras
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestao_compras"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
