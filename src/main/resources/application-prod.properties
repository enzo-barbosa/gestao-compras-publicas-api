# Production settings (overrides application.properties)
# Active profile via SPRING_PROFILES_ACTIVE=prod
spring.jpa.hibernate.ddl-auto=validate

# JWT: sem default em produção — JWT_SECRET obrigatório (fail-fast no JwtService)
jwt.secret=${JWT_SECRET:}

# SQL logs desativados em produção (heredram DEBUG do application.properties)
logging.level.org.hibernate.SQL=INFO

# Actuator em produção: só health/info, sem detalhes em requisições não autenticadas.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
