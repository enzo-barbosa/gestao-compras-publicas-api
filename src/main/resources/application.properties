spring.application.name=gestao-compras-publicas

# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/gestao_compras
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Schema gerenciado pelo Flyway (src/main/resources/db/migration)
# baseline-on-migrate: banco de dev existente é marcado na V1; banco novo aplica todas as migrations.
# ddl-auto=validate em todos os profiles: qualquer mudança de entidade exige uma migration.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# SQL logs (dev) — logs a query, mas NÃO os valores dos parâmetros (evita expor dados sensíveis)
logging.level.org.hibernate.SQL=DEBUG
# Para inspecionar os binds (valores dos parâmetros) em debug local, ative manualmente:
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Segredo JWT: define via JWT_SECRET (env) em produção; default abaixo só para dev.
# Em produção (application-prod.properties) jwt.secret=${JWT_SECRET:} + fail-fast no JwtService.
jwt.secret=${JWT_SECRET:7UCOP8d9ehVIMrTJ3KkJ9ewGnVsvfc4vRvOERjHxL50JXFRChIhhJLIXYwNZtUvH}
# TTL do token: 8 horas (sobrescreva via JWT_EXPIRATION_MS se necessário).
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Rate limiting (anti brute-force) nas rotas públicas de autenticação.
# Em testes, RATE_LIMIT_HABILITADO=false é definido no surefire (pom.xml) para não interferir
# nos logins repetidos das integrações. As chaves dos limites são as usadas pelo RateLimitFilter.
rate-limit.habilitado=${RATE_LIMIT_HABILITADO:true}
rate-limit.maximo-chaves=${RATE_LIMIT_MAX_CHAVES:10000}
rate-limit.limites.login.requisicoes=${RATE_LIMIT_LOGIN:10}
rate-limit.limites.login.janela-segundos=60
rate-limit.limites.registro.requisicoes=${RATE_LIMIT_REGISTRO:5}
rate-limit.limites.registro.janela-segundos=300
rate-limit.limites.redefinir-senha.requisicoes=${RATE_LIMIT_REDEFINIR:5}
rate-limit.limites.redefinir-senha.janela-segundos=900

# Actuator: expõe apenas health e info; health é público (monitoração) e o restante exige ADMIN.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true

# Swagger/OpenAPI (springdoc): habilitado apenas fora de produção (em prod, swagger.ativo=false).
# Acessível em /swagger-ui.html (Bearer JWT + cabeçalho X-Org-Id opcional para GETs públicos).
swagger.ativo=true
